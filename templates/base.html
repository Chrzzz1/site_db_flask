<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{ title or "Site + Base de données" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <div class="brand">
          <div class="brand__title">Site + Base de données</div>
          <div class="brand__subtitle">Interroger et voir les résultats</div>
        </div>
        <nav class="nav">
          <a class="nav__link {{ 'nav__link--active' if request.endpoint == 'index' else '' }}" href="{{ url_for('index') }}">Recherche</a>
          <a class="nav__link {{ 'nav__link--active' if request.endpoint == 'add_patient_form' else '' }}" href="{{ url_for('add_patient_form') }}">Ajouter un patient</a>
          <a class="nav__link {{ 'nav__link--active' if request.endpoint == 'sql_console' else '' }}" href="{{ url_for('sql_console') }}">SQL (lecture seule)</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="container">
        <div class="muted">
          Base: SQLite local ou PostgreSQL (via <code>DATABASE_URL</code>) — Démo Flask
        </div>
      </div>
    </footer>
  </body>
</html>
