{% extends "base.html" %}
{% set title = "Inscription" %}

{% block content %}
  <section class="card" style="max-width: 360px; margin: 40px auto;">
    <h1>Inscription</h1>
    {% if error %}
      <div class="alert alert--error">{{ error }}</div>
    {% endif %}
    <form class="form" method="post" action="{{ url_for('register_post') }}">
      <div class="form__row">
        <label class="label" for="username">Identifiant</label>
        <input class="input" id="username" name="username" required autofocus autocomplete="username" minlength="2" />
      </div>
      <div class="form__row">
        <label class="label" for="password">Mot de passe</label>
        <input class="input" id="password" name="password" type="password" required autocomplete="new-password" minlength="6" />
      </div>
      <div class="form__row">
        <label class="label" for="password2">Confirmer le mot de passe</label>
        <input class="input" id="password2" name="password2" type="password" required autocomplete="new-password" />
      </div>
      <div class="form__actions">
        <button class="btn" type="submit">Créer mon compte</button>
      </div>
    </form>
    <p class="muted" style="margin-top: 16px;">
      Déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a>
    </p>
  </section>
{% endblock %}
